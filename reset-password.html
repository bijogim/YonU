<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YonU Reset Password</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h2 {
      margin-top: 100px;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 30px;
    }
    input[type="email"] {
      width: 400px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .find-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 9px;
      width: 425px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .find-btn:hover {
      background-color: #589ee5;
    }
    .back-link {
      margin-top: 20px;
      font-size: 0.9em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .back-link a {
      color: #6db2ff;
      text-decoration: none;
    }
    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.9em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2 id="title"></h2>
  <form id="reset-form" class="form-group">
    <input type="email" id="email" required>
    <button type="submit" class="find-btn" id="submitBtn"></button>
  </form>
  <div class="back-link">
    <a href="" id="backLink"></a>
    <select id="languageSelect">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="cn">中文</option>
    </select>
  </div>

  <script>
    function setLangUI(lang) {
      localStorage.setItem("lang", lang);
      const t = translations[lang] || translations.ko;
      document.getElementById("title").textContent = t.title;
      document.getElementById("email").placeholder = t.placeholder;
      document.getElementById("submitBtn").textContent = t.button;
      document.getElementById("backLink").textContent = t.back;
      document.getElementById("backLink").href = t.backUrl;
      document.getElementById("languageSelect").value = lang;
    }

    const translations = {
      ko: {
        title: "비밀번호 찾기",
        placeholder: "연세 이메일을 입력해주세요",
        button: "비밀번호 찾기",
        back: "로그인 페이지로 돌아가기",
        backUrl: "/login.html",
        success: "비밀번호 재설정 링크가 이메일로 전송되었습니다.",
        fail: "요청 처리 중 문제가 발생했습니다.",
        error: "서버와 통신 중 오류가 발생했습니다."
      },
      en: {
        title: "Find Password",
        placeholder: "Please enter your Yonsei email",
        button: "Reset Password",
        back: "Back to Login Page",
        backUrl: "/login.html",
        success: "Password reset link has been sent to your email.",
        fail: "There was a problem processing your request.",
        error: "An error occurred while communicating with the server."
      },
      jp: {
        title: "パスワードを探す",
        placeholder: "延世大学のメールアドレスを入力してください",
        button: "パスワードを探す",
        back: "ログインページに戻る",
        backUrl: "/login.html",
        success: "パスワード再設定リンクがメールに送信されました。",
        fail: "リクエスト処理中に問題が発生しました。",
        error: "サーバーとの通信中にエラーが発生しました。"
      },
      cn: {
        title: "找回密码",
        placeholder: "请输入延世大学邮箱",
        button: "找回密码",
        back: "返回登录页面",
        backUrl: "/login.html",
        success: "重置密码链接已发送至您的邮箱。",
        fail: "处理请求时发生问题。",
        error: "与服务器通信时发生错误。"
      }
    };

    const currentLang = localStorage.getItem("lang") || "ko";
    setLangUI(currentLang);

    document.getElementById("languageSelect").addEventListener("change", function() {
      setLangUI(this.value);
    });

    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const t = translations[localStorage.getItem("lang") || "ko"];
      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email })
      })
      .then(response => {
        if (response.ok) {
          alert(t.success);
        } else {
          alert(t.fail);
        }
      })
      .catch(error => {
        console.error('오류 발생:', error);
        alert(t.error);
      });
    });
  </script>
</body>
</html>
