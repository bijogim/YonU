<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YonU 회원가입</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h3 {
      margin: 30px 0 40px 0;
      font-size: 22px;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"],
    .signup-btn,
    select {
      padding: 10.5px;
      margin-bottom: 35px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      font-size: 14px;
    }
    .checkbox input {
      margin-right: 10px;
    }
    .signup-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      transition: background-color 0.5s;
      cursor: pointer;
    }
    .signup-btn:hover {
      background-color: #2145a9;
    }
    #modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #modal:target {
      display: flex;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      text-decoration: none;
      color: #aaa;
      font-weight: bold;
      transition: color 0.25s;
    }
    .modal-close:hover {
      color: black;
    }
    .terms-link {
      font-size: 12px;
      color: #3160e2;
      text-decoration: underline;
      margin-left: 10px;
    }
    @media (max-width: 600px) {
      input[type="text"], input[type="password"], input[type="email"], .signup-btn, select { width: 280px; }
      .language-select { width: 300px; }
    }
    @media (min-width: 601px) and (max-width: 1024px) {
      input[type="text"], input[type="password"], input[type="email"], .signup-btn, select { width: 340px; }
      .language-select { width: 360px; }
    }
    @media (min-width: 1025px) {
      input[type="text"], input[type="password"], input[type="email"], .signup-btn, select { width: 400px; }
      .language-select { width: 420px; }
    }
  </style>
</head>
<body>
  <h3 id="title"></h3>
  <select id="language" class="language-select" required>
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="zh">中文</option>
  </select>
  <form id="signup-form">
    <input type="email" id="email" required>
    <input type="password" id="password" required>
    <input type="text" id="realName" required>
    <input type="text" id="studentId" required>
    <input type="text" id="department" required>
    <input type="text" id="nickname" required>
    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <label for="terms" id="termsLabel"></label>
      <a href="#modal" class="terms-link" id="termsLink"></a>
    </div>
    <button type="submit" class="signup-btn" id="submitBtn"></button>
  </form>
  <div style="margin-top: 20px; margin-bottom: 40px; font-size: 0.9em;">
    <a href="login.html" style="color: #3160e2; text-decoration: none;" id="backToLogin"></a>
  </div>
  <div id="modal">
    <div class="modal-content">
      <a href="#" class="modal-close">&times;</a>
      <h4 id="modalTitle"></h4>
      <p style="font-size: 13px; text-align: left;" id="modalContent"></p>
    </div>
  </div>
  <script>
    const translations = {
      ko: {
        title: "회원 정보를 입력해주세요",
        placeholders: ["연세 이메일", "비밀번호", "이름", "학번", "학과", "닉네임"],
        terms: "개인정보 이용 및 회원가입 약관 동의",
        viewTerms: "[약관 보기]",
        submit: "회원가입",
        back: "로그인 페이지로 돌아가기",
        modalTitle: "개인정보 이용 및 회원가입 약관",
        modalContent: `YonU는 연세대학교 재학생을 위한 서비스이며, 회원가입 시 다음 사항에 동의한 것으로 간주합니다.<br><br>
          ● 수집정보: 이름, 학번, 학과, 연세 이메일, 닉네임 등<br>
          ● 사용목적: 커뮤니티 운영, 인증, 시간표 공유 등<br>
          ● 보관기간: 탈퇴 시 즉시 파기<br>
          ● 기타 사항은 개인정보 처리방침 참고<br><br>
          본 약관은 서비스 개선 및 정책 변경에 따라 수정될 수 있으며, 변경 시 공지를 통해 안내합니다.`
      },
      en: {
        title: "Please enter your information",
        placeholders: ["Yonsei Email", "Password", "Name", "Student ID", "Department", "Nickname"],
        terms: "Agree to Terms and Privacy Policy",
        viewTerms: "[View Terms]",
        submit: "Sign Up",
        back: "Back to Login Page",
        modalTitle: "Terms and Privacy Policy",
        modalContent: `YonU is a service for Yonsei University students, and by registering, you agree to the following:<br><br>
          ● Collected Info: Name, Student ID, Department, Yonsei Email, Nickname, etc.<br>
          ● Purpose: Community operations, verification, timetable sharing, etc.<br>
          ● Retention: Deleted immediately upon withdrawal<br>
          ● Refer to Privacy Policy for details<br><br>
          Terms may change due to policy updates and improvements. You will be notified accordingly.`
      },
      ja: {
        title: "会員情報をご入力ください",
        placeholders: ["延世メールアドレス", "パスワード", "本名", "学籍番号", "学科", "ニックネーム"],
        terms: "個人情報利用及び会員登録規約への同意",
        viewTerms: "[規約を見る]",
        submit: "会員登録",
        back: "ログインページに戻る",
        modalTitle: "個人情報利用及び会員登録規約",
        modalContent: `YonUは延世大学の在学生のためのサービスであり、会員登録時に以下の事項に同意したものとみなします。<br><br>
          ● 収集情報：氏名、学籍番号、学科、延世メールアドレス、ニックネームなど<br>
          ● 使用目的：コミュニティ運営、認証、時間割共有など<br>
          ● 保管期間：退会時即時破棄<br>
          ● その他事項は個人情報処理方針参照<br><br>
          本規約はサービス改善及び方針変更により修正される場合があり、変更時はお知らせを通じて案内します。`
      },
      zh: {
        title: "请输入您的信息",
        placeholders: ["延世邮箱", "密码", "真实姓名", "学号", "院系", "昵称"],
        terms: "同意服务条款及个人信息处理政策",
        viewTerms: "[查看条款]",
        submit: "注册",
        back: "返回登录",
        modalTitle: "服务条款及个人信息处理政策",
        modalContent: `YonU是为延世大学学生提供的服务，注册即视为同意以下条款：<br><br>
          ● 收集信息：姓名、学号、院系、延世邮箱、昵称等<br>
          ● 使用目的：社区运营、身份验证、课表共享等<br>
          ● 保留期限：退会时立即删除<br>
          ● 其他事项请参考个人信息处理政策<br><br>
          本条款可能因服务改进或政策变更而修改，修改时会通过公告通知。`
      }
    };

    function setLang(lang) {
      localStorage.setItem("lang", lang);
      const t = translations[lang] || translations.ko;
      document.getElementById("title").textContent = t.title;
      document.getElementById("email").placeholder = t.placeholders[0];
      document.getElementById("password").placeholder = t.placeholders[1];
      document.getElementById("realName").placeholder = t.placeholders[2];
      document.getElementById("studentId").placeholder = t.placeholders[3];
      document.getElementById("department").placeholder = t.placeholders[4];
      document.getElementById("nickname").placeholder = t.placeholders[5];
      document.getElementById("termsLabel").textContent = t.terms;
      document.getElementById("termsLink").textContent = t.viewTerms;
      document.getElementById("submitBtn").textContent = t.submit;
      document.getElementById("backToLogin").textContent = t.back;
      document.getElementById("modalTitle").textContent = t.modalTitle;
      document.getElementById("modalContent").innerHTML = t.modalContent;
      document.getElementById("language").value = lang;
    }

    const userLang = localStorage.getItem("lang") || "ko";
    setLang(userLang);

    document.getElementById("language").addEventListener("change", function () {
      setLang(this.value);
    });

    document.getElementById("signup-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("realName").value.trim();
      const studentId = document.getElementById("studentId").value.trim();
      const department = document.getElementById("department").value.trim();
      const nickname = document.getElementById("nickname").value.trim();
      const preferredLanguage = document.getElementById("language").value;
      const termsChecked = document.getElementById("terms").checked;

      if (!termsChecked) {
        alert("📌 약관에 동의하셔야 합니다.");
        return;
      }

      if (!email || !password || !name || !studentId || !department || !nickname) {
        alert("모든 정보를 입력해주세요.");
        return;
      }

      const userDto = { email, password, name, studentId, department, nickname, preferredLanguage };

      try {
        const response = await fetch("http://localhost:8080/api/sign_up", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userDto)
        });

        const result = await response.text();

        if (response.ok) {
          alert("🎉 회원가입 성공! 로그인 페이지로 이동합니다.");
          window.location.href = "/login.html";
        } else {
          alert("❌ 회원가입 실패: " + result);
        }
      } catch (error) {
        console.error("서버 통신 오류:", error);
        alert("⚠️ 서버와 연결 중 오류가 발생했습니다.");
      }
    });
  </script>
</body>
</html>
