<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YonU 회원가입</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h3 {
      margin: 30px 0 40px 0;
      font-size: 22px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    .signup-btn,
    select {
      padding: 10.5px;
      margin-bottom: 35px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      font-size: 14px;
    }

    .checkbox input {
      margin-right: 10px;
    }

    .signup-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      transition: background-color 0.5s;
      cursor: pointer;
    }

    .signup-btn:hover {
      background-color: #2145a9;
    }

    /* 팝업 스타일 */
    #modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #modal:target {
      display: flex;
    }

    .modal-content {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      text-decoration: none;
      color: #aaa;
      font-weight: bold;
      transition: color 0.25s;
    }

    .modal-close:hover {
      color: black;
    }

    .terms-link {
      font-size: 12px;
      color: #3160e2;
      text-decoration: underline;
      margin-left: 10px;
    }

    /* ✅ 미디어쿼리별 고정 px 크기 */

    /* 모바일 (최대 600px) */
    @media (max-width: 600px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 280px;
      }

      .language-select {
        width: 300px;  /* 언어 선택만 20px 넓게 */
      }
    }

    /* 태블릿 (601px ~ 1024px) */
    @media (min-width: 601px) and (max-width: 1024px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 340px;
      }

      .language-select {
        width: 360px;  /* 언어 선택만 20px 넓게 */
      }
    }

    /* PC (1025px 이상) */
    @media (min-width: 1025px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 400px;
      }

      .language-select {
        width: 420px;  /* 언어 선택만 20px 넓게 */
      }
    }
  </style>
</head>
<body>

  <h3>회원 정보를 입력해주세요</h3>

  <form action="/submit" method="POST">
    <input type="email" id="email" placeholder="연세 이메일" required>
    <input type="password" id="password" placeholder="비밀번호" required>
    <input type="text" id="realName" placeholder="실명" required>
    <input type="text" id="studentId" placeholder="학번" required>
    <input type="text" id="department" placeholder="학과" required>
    <input type="text" id="nickname" placeholder="닉네임" required>

    <!-- 언어 선택 드롭다운 -->
    <select id="language" class="language-select" required>
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="cn">中文</option>
    </select>

    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <label for="terms">개인정보 이용 및 회원가입 약관 동의</label>
      <a href="#modal" class="terms-link">[약관 보기]</a>
    </div>

    <button type="submit" class="signup-btn">회원가입</button>
  </form>

  <!-- 메인화면으로 돌아가기 링크 추가 -->
  <div style="margin-top: 20px; margin-bottom: 40px; font-size: 0.9em;">
    <a href="login.html" style="color: #3160e2; text-decoration: none;">로그인 화면으로 돌아가기</a>
  </div>

  <!-- 모달 팝업 -->
  <div id="modal">
    <div class="modal-content">
      <a href="#" class="modal-close">&times;</a>
      <h4>개인정보 이용 및 회원가입 약관</h4>
      <p style="font-size: 13px; text-align: left;">
        YonU는 연세대학교 재학생을 위한 서비스로, 회원 가입 시 다음 사항에 동의하는 것으로 간주됩니다.
        <br><br>
        ● 수집 정보: 이름, 학번, 학과, 연세 이메일, 닉네임 등<br>
        ● 사용 목적: 커뮤니티 운영, 인증, 시간표 공유 등<br>
        ● 보관 기간: 탈퇴 시 즉시 파기<br>
        ● 기타 사항은 개인정보처리방침 참조<br><br>
        본 약관은 서비스 개선 및 정책 변경에 따라 수정될 수 있으며, 변경 시 공지사항을 통해 안내드립니다.
      </p>
    </div>
  </div>

</body>
</html>
