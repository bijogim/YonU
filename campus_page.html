<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 작성</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }
    nav a.active {
      color: #3a78c9;
    }
    .form-container {
      max-width: 800px;
      margin: 40px auto 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group select,
    .form-group textarea,
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .form-group textarea {
      height: 200px;
      resize: vertical;
    }
    .submit-btn {
      background-color: #3a78c9;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #2c5ca3;
    }
    .nav-right select.language-select {
      margin: 0;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="main.html"><img src="Logo.png" alt="YonU 로고" style="height: 45px;"></a>
      <a id="nav-board" href="board.html"></a>
      <a id="nav-campus" href="campus_life.html"></a>
      <a id="nav-notice" href="https://mirae.yonsei.ac.kr/wj/1415/subview.do" target="_blank"></a>
      <a id="nav-timetable" href="timetable_loginver.html"></a>
    </div>
    <div class="nav-right">
      <a id="nav-logout" href="logout.html"></a>
      <a id="nav-mypage" href="mypage.html" style="color: #6db2ff;"></a>
      <select id="languageSelect" class="language-select">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="jp">日本語</option>
        <option value="cn">中文</option>
      </select>
    </div>
  </nav>

  <div class="form-container">
    <h2 id="formTitle"></h2>
    <div class="form-group">
      <label for="board" id="labelBoard"></label>
      <select id="board">
        <option value="1">학교 공지</option>
        <option value="2">학교생활</option>
        <option value="3">FAQ</option>
        <option value="4">관공서 링크</option>
      </select>
    </div>
    <div class="form-group">
      <label for="title" id="labelTitle"></label>
      <input type="text" id="title">
    </div>
    <div class="form-group">
      <label for="hashtags" id="labelHashtags"></label>
      <input type="text" id="hashtags">
    </div>
    <div class="form-group">
      <label for="content" id="labelContent"></label>
      <textarea id="content"></textarea>
    </div>
    <div class="form-group">
      <label for="file" id="labelFile"></label>
      <input type="file" id="file">
    </div>
    <button class="submit-btn" onclick="submitPost()" id="submitButton"></button>
  </div>

  <script>
    const lang = localStorage.getItem("lang") || "ko";

    const navTexts = {
      ko: {
        board: "게시판",
        campus: "학교 생활",
        notice: "학교 공지",
        timetable: "시간표",
        logout: "로그아웃",
        mypage: "내 페이지"
      },
      en: {
        board: "Board",
        campus: "Campus Life",
        notice: "Official Notices",
        timetable: "Timetable",
        logout: "Logout",
        mypage: "My Page"
      },
      jp: {
        board: "掲示板",
        campus: "キャンパスライフ",
        notice: "学校のお知らせ",
        timetable: "時間割",
        logout: "ログアウト",
        mypage: "マイページ"
      },
      cn: {
        board: "公告栏",
        campus: "校园生活",
        notice: "学校通知",
        timetable: "课程表",
        logout: "退出登录",
        mypage: "我的页面"
      }
    };

    const tnav = navTexts[lang];
    if (tnav) {
      document.getElementById("nav-board").textContent = tnav.board;
      document.getElementById("nav-campus").textContent = tnav.campus;
      document.getElementById("nav-notice").textContent = tnav.notice;
      document.getElementById("nav-timetable").textContent = tnav.timetable;
      document.getElementById("nav-logout").textContent = tnav.logout;
      document.getElementById("nav-mypage").textContent = tnav.mypage;
    }

    const langSelect = document.getElementById("languageSelect");
    langSelect.value = lang;
    langSelect.addEventListener("change", function () {
      localStorage.setItem("lang", this.value);
      location.reload();
    });

    const translations = {
      ko: {
        formTitle: "게시글 작성",
        labelBoard: "게시판 선택",
        labelTitle: "제목",
        labelHashtags: "해시태그",
        labelContent: "본문",
        labelFile: "첨부파일",
        submitButton: "작성하기",
        alertSuccess: "게시물이 성공적으로 작성되었습니다.",
        alertFail: "게시글 작성에 실패했습니다.",
        alertEmpty: "제목, 본문, 게시판을 확인해주세요.",
        boards: ["학교 공지", "학교생활", "FAQ", "관공서 링크"]
      },
      en: {
        formTitle: "Write Post",
        labelBoard: "Select Board",
        labelTitle: "Title",
        labelHashtags: "Hashtags",
        labelContent: "Content",
        labelFile: "Attachment",
        submitButton: "Submit",
        alertSuccess: "Post created successfully.",
        alertFail: "Failed to create the post.",
        alertEmpty: "Please check title, content, and board selection.",
        boards: ["School Notices", "Campus Life", "FAQ", "Gov Links"]
      },
      jp: {
        formTitle: "投稿作成",
        labelBoard: "掲示板選択",
        labelTitle: "タイトル",
        labelHashtags: "ハッシュタグ",
        labelContent: "本文",
        labelFile: "添付ファイル",
        submitButton: "投稿",
        alertSuccess: "投稿が作成されました。",
        alertFail: "投稿作成に失敗しました。",
        alertEmpty: "タイトル、本文、掲示板を確認してください。",
        boards: ["学校のお知らせ", "学校生活", "FAQ", "官公庁リンク"]
      },
      cn: {
        formTitle: "发布帖子",
        labelBoard: "选择公告板",
        labelTitle: "标题",
        labelHashtags: "标签",
        labelContent: "正文",
        labelFile: "附件",
        submitButton: "提交",
        alertSuccess: "帖子已成功发布。",
        alertFail: "发布帖子失败。",
        alertEmpty: "请检查标题、内容和公告板选择。",
        boards: ["学校公告", "校园生活", "常见问题", "政府链接"]
      }
    };

    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;

      document.getElementById("formTitle").textContent = t.formTitle;
      document.getElementById("labelBoard").textContent = t.labelBoard;
      document.getElementById("labelTitle").textContent = t.labelTitle;
      document.getElementById("labelHashtags").textContent = t.labelHashtags;
      document.getElementById("labelContent").textContent = t.labelContent;
      document.getElementById("labelFile").textContent = t.labelFile;
      document.getElementById("submitButton").textContent = t.submitButton;

      const boardSelect = document.getElementById("board");
      Array.from(boardSelect.options).forEach((option, index) => {
        option.textContent = t.boards[index];
      });
    }

    setLanguage(lang);

    function submitPost() {
      const t = translations[lang];
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const board = document.getElementById("board").value;
      const hashtags = document.getElementById("hashtags").value;

      if (!title || !content || !board) {
        alert(t.alertEmpty);
        return;
      }

      const data = {
        title,
        content,
        submenuId: parseInt(board),
        hashtags
      };

      fetch("/api/posts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
        .then(res => {
          if (res.ok) {
            alert(t.alertSuccess);
            window.location.href = "/board.html";
          } else {
            alert(t.alertFail);
          }
        })
        .catch(err => {
          alert(t.alertFail);
        });
    }
  </script>
</body>
</html>
