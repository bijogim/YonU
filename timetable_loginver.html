<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>시간표 | YonU</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
    }
    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }
    .language-select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      gap: 20px;
    }
    .sidebar {
      width: 200px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: fit-content;
    }
    .sidebar label { font-weight: bold; }
    .sidebar select, .sidebar button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .sidebar button {
      background-color: #3a78c9;
      color: white;
      border: none;
      cursor: pointer;
    }
    .sidebar button:hover {
      background-color: #2d5ea7;
    }
    .section {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      flex: 1;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .timetable {
      display: grid;
      grid-template-columns: 60px repeat(5, 1fr);
      border-top: 1px solid #ccc;
      border-left: 1px solid #ccc;
    }
    .timetable div {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      min-height: 60px;
      position: relative;
    }
    .time-label {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;     /* 수직 중앙 정렬 */
      justify-content: center; /* 수평 중앙 정렬 */
      height: 60px;            /* 필요시 높이 명시 */
    }
    .day-label {
      background-color: #e7f1ff;
      text-align: center;
      font-weight: bold;
    }
    .class-box {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      padding: 5px;
      font-size: 13px;
      color: #000;
      background-color: rgba(173, 216, 230, 0.5);
    }
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 12px;
      background: none;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 8px;
      width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- ✅ 네비게이션 -->
  <nav>
    <div class="nav-left">
      <a href="main.html"><img src="Logo.png" alt="YonU 로고" style="height: 45px;"></a>
      <a id="nav-board" href="board.html"></a>
      <a id="nav-campus" href="campus_life.html"></a>
      <a id="nav-notice" href="https://mirae.yonsei.ac.kr/wj/1415/subview.do" target="_blank"></a>
      <a id="nav-timetable" href="timetable_loginver.html"></a>
    </div>
    <div class="nav-right" id="navRight">
      <a id="nav-logout" href="logout.html"></a>
      <a id="nav-mypage" href="mypage.html" style="color: #6db2ff;"></a>
      <select id="languageSelect" class="language-select">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="jp">日本語</option>
        <option value="zh">中文</option>
      </select>
    </div>
  </nav>

  <div class="container">
    <div class="sidebar">
      <label data-i18n="editableTitle">(제목 수정 가능)</label>
      <select id="semester"><option id="semesterOption">2025년 1학기</option></select>
      <button onclick="openClassModal()" data-i18n="addTimetable">시간표 추가하기</button>
      <button onclick="saveTimetableToBackend()" data-i18n="save">저장하기</button>
      <button onclick="downloadTimetable()" data-i18n="download">PNG 다운로드</button>
    </div>
    <div class="section">
      <h2 data-i18n="myTimetable">📘 나의 시간표</h2>
      <div class="timetable" id="timetable"></div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="classModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h3 data-i18n="modalTitle">과목 검색 및 추가</h3>
      <input type="text" id="searchInput" placeholder="수업명 또는 교수명 검색" data-i18n-placeholder="searchPlaceholder" />
      <div id="classList"></div>
    </div>
  </div>

  <!-- ✅ 언어 스크립트 -->
  <script>
    const translations = {
      ko: {
        editableTitle: "(제목 수정 가능)",
        semester: "2025년 1학기",
        addTimetable: "시간표 추가하기",
        save: "저장하기",
        download: "PNG 다운로드",
        myTimetable: "📘 나의 시간표",
        modalTitle: "과목 검색 및 추가",
        searchPlaceholder: "수업명 또는 교수명 검색",
        nav: {
          board: "게시판", campus: "학교 생활", notice: "학교 공지", timetable: "시간표", logout: "로그아웃", mypage: "내 페이지"
        }
      },
      en: {
        editableTitle: "(Editable Title)",
        semester: "2025 Spring Semester",
        addTimetable: "Add to Timetable",
        save: "Save",
        download: "Download PNG",
        myTimetable: "📘 My Timetable",
        modalTitle: "Search and Add Classes",
        searchPlaceholder: "Search by class or professor name",
        nav: {
          board: "Board", campus: "Campus Life", notice: "Notices", timetable: "Timetable", logout: "Logout", mypage: "My Page"
        }
      },
      jp: {
        editableTitle: "(編集可能なタイトル)",
        semester: "2025年春学期",
        addTimetable: "時間割に追加",
        save: "保存",
        download: "PNGダウンロード",
        myTimetable: "📘 私の時間割",
        modalTitle: "授業検索・追加",
        searchPlaceholder: "授業名または教授名で検索",
        nav: {
          board: "掲示板", campus: "キャンパスライフ", notice: "学校のお知らせ", timetable: "時間割", logout: "ログアウト", mypage: "マイページ"
        }
      },
      zh: {
        editableTitle: "(可编辑标题)",
        semester: "2025年春季学期",
        addTimetable: "添加到课程表",
        save: "保存",
        download: "下载PNG",
        myTimetable: "📘 我的课程表",
        modalTitle: "搜索并添加课程",
        searchPlaceholder: "搜索课程或教授名称",
        nav: {
          board: "公告栏", campus: "校园生活", notice: "学校通知", timetable: "课程表", logout: "退出登录", mypage: "我的页面"
        }
      }
    };

    function updateLanguage(lang) {
      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t[key] || el.textContent;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t[key] || el.placeholder;
      });
      const semesterOption = document.getElementById("semesterOption");
      if (semesterOption) semesterOption.textContent = t.semester;
      if (t.nav) {
        document.getElementById("nav-board").textContent = t.nav.board;
        document.getElementById("nav-campus").textContent = t.nav.campus;
        document.getElementById("nav-notice").textContent = t.nav.notice;
        document.getElementById("nav-timetable").textContent = t.nav.timetable;
        document.getElementById("nav-logout").textContent = t.nav.logout;
        document.getElementById("nav-mypage").textContent = t.nav.mypage;
      }
    }

    const selectedLang = localStorage.getItem("lang") || "ko";
    document.getElementById("languageSelect").value = selectedLang;
    updateLanguage(selectedLang);

    document.getElementById("languageSelect").addEventListener("change", function () {
      const lang = this.value;
      localStorage.setItem("lang", lang);
      updateLanguage(lang);
    });

    const timetable = document.getElementById("timetable");
    const times = ["9AM","10AM","11AM","12PM","13PM","14PM","15PM","16PM","17PM","18PM"];
    for (let i = 0; i < times.length; i++) {
      timetable.innerHTML += `<div class="time-label">${times[i]}</div>`;
      for (let j = 0; j < 5; j++) {
        timetable.innerHTML += `<div data-day="${j}" data-time="${i}"></div>`;
      }
    }
  </script>
</body>
</html>
