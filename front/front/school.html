<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교생활 | 게시글 상세보기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
    }
    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }
    nav a.active {
      color: #3a78c9;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 25px;
      color: #444;
    }
    .author-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .profile-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #ccc;
    }
    .nickname {
      font-weight: bold;
    }
    .time {
      font-size: 12px;
      color: #777;
    }
    .post-title {
      font-size: 22px;
      margin-bottom: 15px;
    }
    .post-content {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .reaction {
      font-size: 14px;
      color: #444;
      margin-bottom: 25px;
    }
    .reaction button {
      margin-left: 10px;
      padding: 5px 10px;
      border: none;
      background-color: #eee;
      border-radius: 4px;
      cursor: pointer;
    }
    .reaction button.active {
      background-color: #3a78c9;
      color: white;
    }
    .comment-section {
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }
    .comment {
      margin-bottom: 20px;
    }
    .comment-author {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .comment-text {
      margin-bottom: 4px;
    }
    .comment-time {
      font-size: 12px;
      color: #999;
    }
    .confirm-box {
      background-color: #333;
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }
    .confirm-buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .confirm-buttons button {
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .confirm-buttons button:first-child {
      background-color: #3a78c9;
      color: white;
    }
    .confirm-buttons button:last-child {
      background-color: #ccc;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 14px;
    }
    button.submit-comment {
      margin-top: 10px;
      padding: 10px 16px;
      font-weight: bold;
      border: none;
      background-color: #3a78c9;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button.submit-comment:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="main.html"><img src="Logo.png" alt="YonU 로고" style="height: 45px;"></a>
      <a href="board.html">게시판</a>
      <a href="campus_life.html">학교 생활</a>
      <a href="https://mirae.yonsei.ac.kr/wj/1415/subview.do" target="_blank">학교 공지</a>
      <a href="timetable_loginver.html">시간표</a>
    </div>
    <div class="nav-right">
      <a href="logout.html">로그아웃</a>
      <a href="mypage.html" style="color: #6db2ff;">내 페이지</a>
    </div>
  </nav>

  <div class="container">
    <h2>학교생활</h2>

    <div class="author-info">
      <div class="profile-img"></div>
      <div>
        <div class="nickname">익명 사용자</div>
        <div class="time">2025.05.24 18:00</div>
      </div>
    </div>

    <div class="post-title">학교 축제 일정 알려드립니다</div>
    <div class="post-content">
      이번 연세대학교 미래캠퍼스 축제는 6월 첫째 주에 열릴 예정입니다. 자세한 일정은 추후 공지 예정입니다.
    </div>

    <div class="reaction">
      <span id="like-count">👍 5</span>
      <span id="dislike-count">👎 1</span>
      <span id="comment-count">💬 2</span>
      <button id="like-btn" onclick="toggleReaction('like')">좋아요</button>
      <button id="dislike-btn" onclick="toggleReaction('dislike')">싫어요</button>
    </div>

    <div class="comment-section">
      <div id="confirm-box" class="confirm-box" style="display: none;">
        <div class="confirm-text">댓글을 작성하시겠습니까?</div>
        <div class="confirm-buttons">
          <button onclick="submitConfirmedComment()">예</button>
          <button onclick="cancelComment()">아니요</button>
        </div>
      </div>
      <h3>댓글</h3>
      <textarea id="comment-box" rows="4" placeholder="댓글을 입력하세요."></textarea><br>
      <div style="text-align: right;">
        <button class="submit-comment" onclick="addComment()">등록</button>
      </div>
      <div id="comment-list">
        <div class="comment">
          <div class="comment-author">익명1</div>
          <div class="comment-text">기대돼요!</div>
          <div class="comment-time">2025.05.24 18:10</div>
        </div>
        <div class="comment">
          <div class="comment-author">익명2</div>
          <div class="comment-text">자세한 시간은 언제 올라오나요?</div>
          <div class="comment-time">2025.05.24 18:12</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let userReaction = null;
    let likeCount = 5;
    let dislikeCount = 1;
    let commentCount = 2;
    let pendingComment = "";

    function updateReactionDisplay() {
      document.getElementById("like-count").textContent = `👍 ${likeCount}`;
      document.getElementById("dislike-count").textContent = `👎 ${dislikeCount}`;
    }

    function toggleReaction(type) {
      if (userReaction === type) {
        if (type === 'like') likeCount--;
        else dislikeCount--;
        userReaction = null;
      } else {
        if (type === 'like') {
          if (userReaction === 'dislike') dislikeCount--;
          likeCount++;
        } else {
          if (userReaction === 'like') likeCount--;
          dislikeCount++;
        }
        userReaction = type;
      }
      updateReactionDisplay();
    }

    function addComment() {
      const commentBox = document.getElementById("comment-box");
      const text = commentBox.value.trim();
      if (!text) {
        alert("댓글을 입력해주세요.");
        return;
      }
      pendingComment = text;
      document.getElementById("confirm-box").style.display = "block";
    }

    function submitConfirmedComment() {
      const now = new Date();
      const timeStr = now.toLocaleString("ko-KR");
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `
        <div class="comment-author">익명</div>
        <div class="comment-text">${pendingComment}</div>
        <div class="comment-time">${timeStr}</div>
      `;
      document.getElementById("comment-list").appendChild(div);
      commentCount++;
      document.getElementById("comment-count").textContent = `💬 ${commentCount}`;
      document.getElementById("comment-box").value = "";
      pendingComment = "";
      document.getElementById("confirm-box").style.display = "none";
    }

    function cancelComment() {
      pendingComment = "";
      document.getElementById("confirm-box").style.display = "none";
    }
  </script>
</body>
</html>
