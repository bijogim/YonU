<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <style>
    * { box-sizing: border-box; }

   body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  margin: 0;
  padding: 0;
  position: relative;
  min-height: 100vh;
}


    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }

    nav a.active {
      color: #3a78c9;
    }

    .container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
  padding-bottom: 80px; /* 푸터 높이 확보 */
}


    .banner {
      height: 150px;
      background-color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #555;
      margin-bottom: 20px;
    }

    .category-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .category-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background-color: #f0f0f0;
      cursor: pointer;
      font-weight: bold;
    }

    .category-buttons button.active {
  background-color: #3a78c9;
  color: white;
}

    .board-item {
      display: flex;
      gap: 20px;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      align-items: center;
      cursor: pointer;
    }

    .board-item:hover {
      background-color: #f8faff;
    }

    .board-thumb {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #e0e0e0;
      flex-shrink: 0;
    }

    .board-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .board-title {
      font-size: 16px;
      font-weight: bold;
      color: #222;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board-hashtags {
      color: #3a78c9;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board-meta {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: #666;
    }

    .pagination {
      margin-top: 20px;
      text-align: center;
    }

    .pagination a {
      display: inline-block;
      margin: 0 5px;
      padding: 8px 14px;
      color: #007bff;
      text-decoration: none;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .pagination a:hover {
      background-color: #eee;
    }

    .pagination a.current-page {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border-color: #007bff;
    }

    .write-btn-wrapper {
      text-align: right;
      margin: 30px 0 60px;
    }

    .write-btn {
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border: none;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .write-btn:hover {
      background-color: #555;
    }

  footer {
  background-color: #6db2ff;
  color: white;
  text-align: center;
  padding: 15px;
  width: 100%;
  position: absolute;
  bottom: 0;
}

    @media (max-width: 700px) {
      .board-item { flex-direction: column; align-items: flex-start; }
      .board-thumb { width: 100%; height: 160px; }
    }
  </style>
</head>
<body>

<script>
  const buttons = document.querySelectorAll('.category-buttons button');
  const postContainer = document.querySelector('.container');
 const postData = {
  market: [
    {
      title: '프레임하는법',
      author: '익명',
      time: '1시간 전',
      views: 20,
      comments: 2,
      thumb: 'images/thumb1.jpg',
      hashtags: '#중고 #전자기기',
      link: 'market_board.html' // 1번째 게시글 링크
    },
    {
      title: '게이밍 키보드 판매',
      author: '게임러버',
      time: '2시간 전',
      views: 35,
      comments: 1,
      thumb: 'images/thumb2.jpg',
      hashtags: '#키보드 #게이밍'
    }
  ],
  free: [
    {
      title: '학식 맛있나요?',
      author: '익명',
      time: '방금 전',
      views: 12,
      comments: 0,
      thumb: 'images/thumb3.jpg',
      hashtags: '#질문 #학식',
      link: 'free_board.html'
    },
    {
      title: '내일 뭐 먹지?',
      author: '배고픔',
      time: '10분 전',
      views: 8,
      comments: 3,
      thumb: 'images/thumb4.jpg',
      hashtags: '#고민 #점심'
    }
  ],
  freshman: [
    {
      title: 'xxx 교수님',
      author: '익명',
      time: '어제',
      views: 50,
      comments: 5,
      thumb: 'images/thumb5.jpg',
      hashtags: '#교수님 #수업',
      link: 'freshman_board.html'
    },
    {
      title: '수강 신청 팁 공유',
      author: '신입팁',
      time: '2일 전',
      views: 44,
      comments: 4,
      thumb: 'images/thumb6.jpg',
      hashtags: '#수강신청 #꿀팁'
    }
  ],
  department: [
    {
      title: '소웨 사람들',
      author: '익명',
      time: '3일 전',
      views: 60,
      comments: 6,
      thumb: 'images/thumb7.jpg',
      hashtags: '#학과 #매너',
      link: 'department_board.html'
    },
    {
      title: '전공필수 교과목 정정 안내',
      author: '교무처',
      time: '이번 주',
      views: 75,
      comments: 2,
      thumb: 'images/thumb8.jpg',
      hashtags: '#교과목 #정정'
    }
  ]
};

function renderPosts(category) {
  const items = postData[category];
  const existingItems = document.querySelectorAll('.board-item');
  existingItems.forEach(item => item.remove());

  const pagination = document.querySelector('.pagination');

  items.forEach((post, index) => {
    const div = document.createElement('div');
    div.className = 'board-item';
    div.onclick = () => {
      if (index === 0 && post.link) {
        location.href = post.link;
      } else {
        location.href = 'post_detail.html';
      }
    };
    div.innerHTML = `
      <img class="board-thumb" src="${post.thumb}" alt="썸네일" />
      <div class="board-content">
        <div class="board-title">${post.title}</div>
        <div class="board-hashtags">${post.hashtags}</div>
        <div class="board-meta">
          <span>${post.author}</span>
          <span>${post.time}</span>
          <span>조회수: ${post.views}</span>
          <span>댓글수: ${post.comments}</span>
        </div>
      </div>
    `;
    postContainer.insertBefore(div, pagination);
  });
}


  buttons.forEach(button => {
    button.addEventListener('click', () => {
      buttons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      const category = button.id.replace('-board-btn', '');
      renderPosts(category);
    });
  });

  // 기본 렌더링
  document.getElementById('market-board-btn').classList.add('active');
  renderPosts('market');
</script>
