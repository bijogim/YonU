<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YonU 메인화면</title>
  <style>
    * {
      box-sizing: border-box;
    }
    a {
      color: black;
      text-decoration: none;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
    }
    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }
    main {
      flex: 1;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      padding-bottom: 80px;
    }
    .section {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .section h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .calendar {
      background-color: #e7f1ff;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a78c9;
      font-weight: bold;
      border-radius: 4px;
    }
    .board-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .board-item {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .board-item ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
      flex-grow: 1;
    }
    .board-item li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      min-height: 60px;
    }
    .board-item li:last-child {
      border-bottom: none;
    }
    .board-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 12px;
    }
    .board-text {
      flex-grow: 1;
      overflow: hidden;
    }
    .board-title-text {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .board-viewcount {
      font-size: 12px;
      color: #777;
      min-width: 70px;
      text-align: right;
      margin-left: 10px;
    }
    .no-post {
      flex-grow: 1;
      text-align: center;
      color: #999;
      font-size: 14px;
    }
    .more-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #3a78c9;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .more-link:hover,
    .more-link:active {
      text-decoration: underline;
    }
    footer {
      background-color: #6db2ff;
      color: white;
      text-align: center;
      padding: 15px;
      width: 100%;
    }
    @media (max-width: 768px) {
      .board-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>
  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-placeholder').innerHTML = html;
      });
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('http://localhost:8080/api/logged_in', {
    method: 'GET',
    credentials: 'include'
  })
    .then(response => {
      if (!response.ok) {
        throw new Error('로그인 안됨');
      }
      return response.json();
    })
    .then(user => {
      const navRight = document.getElementById('navRight');
      navRight.innerHTML = `
        <span>
          ${user.nickname}님
          <a href="#" class="nav-btn" id="logoutBtn">로그아웃</a>
        </span>
      `;
      document.getElementById('logoutBtn').addEventListener('click', () => {
        fetch('http://localhost:8080/api/logout', {
          method: 'POST',
          credentials: 'include'
        })
        .then(() => {
          alert('로그아웃 되었습니다.');
          window.location.href = 'login.html';
        })
        .catch(err => console.error('로그아웃 실패:', err));
      });
    })
    .catch(err => {
      console.log('🚫 로그인 안된 사용자입니다.', err);
    });
});
</script>

<main>
  <div class="container">
    <div class="section">
      <h2>📅 주요 일정</h2>
      <div class="calendar">
        <img src="calend_final_1300x350.png" alt="캘린더 이미지" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
    </div>

    <div id="boardContainer" class="board-grid"></div>
  </div>
</main>

<footer>
  ⓒ 2025 YonU | 연세대학교 유학생 커뮤니티
</footer>

<script>
const boardMap = {
  1: { title: "장터 게시판", link: "board.html?submenuId=1" },
  2: { title: "자유 게시판", link: "board.html?submenuId=2" },
  3: { title: "새내기 게시판", link: "board.html?submenuId=3" },
  4: { title: "학과 게시판", link: "board.html?submenuId=4" }
};

async function loadBoards() {
  const container = document.getElementById('boardContainer');
  container.innerHTML = '';

  for (const submenuId in boardMap) {
    const board = boardMap[submenuId];
    const boardItem = document.createElement('div');
    boardItem.className = 'board-item';

    let boardHtml = `
      <h2><a href="${board.link}">${board.title}</a></h2>
      <ul>
    `;

    try {
      const response = await fetch(`http://localhost:8080/api/posts?submenuId=${submenuId}&page=0&size=3&sort=createdAt,desc`, {
        method: 'GET',
        credentials: 'include'
      });
      const data = await response.json();

      const posts = data.content || [];
      if (posts.length > 0) {
        posts.forEach(post => {
          boardHtml += `
            <li>
              <img class="board-thumb" src="${post.thumbnailUrl ? 'http://localhost:8080' + post.thumbnailUrl : 'https://via.placeholder.com/50'}" alt="썸네일">
              <div class="board-text">
                <div class="board-title-text">${post.title}
                  </div>
              </div>
              <div class="board-viewcount">조회수 ${post.viewCount}</div>
            </li>
          `;
        });
        for (let i = posts.length; i < 3; i++) {
          boardHtml += `
            <li>
              <div class="no-post">게시글 없음</div>
            </li>
          `;
        }
      } else {
        for (let i = 0; i < 3; i++) {
          boardHtml += `
            <li>
              <div class="no-post">게시글 없음</div>
            </li>
          `;
        }
      }
    } catch (err) {
      console.error(`❌ submenuId ${submenuId} 게시판 로드 실패:`, err);
      for (let i = 0; i < 3; i++) {
        boardHtml += `
          <li>
            <div class="no-post">게시글 없음</div>
          </li>
        `;
      }
    }

    boardHtml += `
      </ul>
      <a class="more-link" href="${board.link}">더보기</a>
    `;

    boardItem.innerHTML = boardHtml;
    container.appendChild(boardItem);
  }
}

document.addEventListener('DOMContentLoaded', loadBoards);
</script>

</body>
</html>
