<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YonU Login</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h2 {
      margin-top: 100px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9em;
      color: gray;
      margin-bottom: 30px;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
    }

    label {
      display: block;
      text-align: left;
      margin-left: 15px;
      font-size: 0.9em;
      margin-bottom: 5px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 90%;
      max-width: 350px;
      padding: 10px;
      margin-bottom: 20px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .login-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 10px;
      width: 90%;
      max-width: 375px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      margin-top: 32px;
      margin-bottom: 10px;
    }

    .extra-links {
      margin-top: 15px;
      font-size: 0.85em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .extra-links a {
      color: #6db2ff;
      text-decoration: none;
    }

    .language-select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

  </style>
</head>
<body>
<h2>Welcome to YonU</h2>
<p class="subtitle">YonU is a community for international students at Yonsei University</p>

<form id="loginForm">
  <label for="email">Email</label>
  <input id="email" type="text" name="email" placeholder="Email" required>

  <label for="password">Password</label>
  <input id="password" type="password" name="password" placeholder="Password" required>

  <button class="login-btn" type="submit">Login</button>
</form>

<div class="extra-links">
  <a href="/reset-password">Find Password</a>
  <a href="/sign_up_en">Sign Up</a>
  <select id="languageSelect" class="language-select">
    <option value="en">English</option>
    <option value="ko">한국어</option>
    <option value="cn">中文</option>
    <option value="jp">日本語</option>
  </select>
</div>

<script>
  document.getElementById("languageSelect").addEventListener("change", function() {
    const selected = this.value;
    switch (selected) {
      case "en":
        window.location.href = "login_en.html";
        break;
      case "jp":
        window.location.href = "login_jp.html";
        break;
      case "cn":
        window.location.href = "login_cn.html";
        break;
      case "ko":
        window.location.href = "login.html";
        break;
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const language = document.getElementById('languageSelect').value;

    if (!emailInput || !passwordInput) {
      alert("Cannot find input fields.");
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      alert('Please enter both your email and password.');
      return;
    }

    const loginData = {
      email,
      password,
      preferredLanguage: language
    };

    const url = '/api/login';

    console.log("📤 Request JSON:");
    console.log(JSON.stringify(loginData, null, 2));

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'same-origin',
        body: JSON.stringify(loginData)
      });

      if (!response.ok) throw new Error('Server response error');

      const resultText = await response.text();
      console.log("📥 Response:");
      console.log(resultText);

      if (resultText.includes("success")) {
        alert("✅ Login successful");
        window.location.href = "/main";
      } else {
        alert("❌ " + resultText);
      }

    } catch (error) {
      console.error("❗ Login request failed:", error);
      alert("⚠️ An error occurred while communicating with the server. Please try again later.");
    }
  });
</script>
</body>
</html>
