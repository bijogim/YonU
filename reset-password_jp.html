<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>パスワードを探す</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h2 {
      margin-top: 100px;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    input[type="email"] {
      width: 400px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .find-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 9px;
      width: 425px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .find-btn:hover {
      background-color: #589ee5;
    }

    .back-link {
      margin-top: 20px;
      font-size: 0.9em;
    }

    .back-link a {
      color: #6db2ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>パスワードを探す</h2>

  <form id="reset-form" class="form-group">
    <input type="email" id="email" placeholder="延世大学のメールアドレスを入力してください" required>
    <button type="submit" class="find-btn">パスワードを探す</button>
  </form>

  <div class="back-link">
    <a href="/login_jp.html">ログインページに戻る</a>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault(); // 기본 form 동작 방지

      const email = document.getElementById('email').value;

      fetch('/api/reset-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'same-origin',  // 👈 중요!
        body: JSON.stringify({ email })
      })

      .then(response => {
        if (response.ok) {
          alert('비밀번호 재설정 링크가 이메일로 전송되었습니다.');
        } else {
          alert('요청 처리 중 문제가 발생했습니다.');
        }
      })
      .catch(error => {
        console.error('오류 발생:', error);
        alert('서버와 통신 중 오류가 발생했습니다.');
      });
    });
  </script>

</body>
</html>
