<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>時間割 | YonU</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
    }
    nav {
      background-color: white;
      border-bottom: 1px solid #ccc;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      gap: 20px;
    }
    .sidebar {
      width: 200px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: fit-content;
    }
    .sidebar label { font-weight: bold; }
    .sidebar select, .sidebar button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .sidebar button {
      background-color: #3a78c9;
      color: white;
      border: none;
      cursor: pointer;
    }
    .sidebar button:hover {
      background-color: #2d5ea7;
    }
    .section {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      flex: 1;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .timetable {
      display: grid;
      grid-template-columns: 60px repeat(5, 1fr);
      border-top: 1px solid #ccc;
      border-left: 1px solid #ccc;
    }
    .timetable div {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      min-height: 60px;
      cursor: pointer;
      position: relative;
    }
    .time-label {
      background-color: #f0f0f0;
      font-weight: bold;
      text-align: center;
    }
    .day-label {
      background-color: #e7f1ff;
      text-align: center;
      font-weight: bold;
    }
    .class-box {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      padding: 5px;
      font-size: 13px;
      color: #000;
      background-color: rgba(173, 216, 230, 0.5);
    }
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 12px;
      background: none;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    /* モーダルスタイル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 8px;
      width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .modal h3 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .modal input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .class-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .class-item:hover {
      background-color: #f0f8ff;
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <script>
    fetch('nav_jp.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-placeholder').innerHTML = html;
      });
  </script>

  <div class="container">
    <div class="sidebar">
      <label><span contenteditable="true">(編集可能なタイトル)</span></label>
      <select id="semester"><option>2025年春学期</option></select>
      <button onclick="openClassModal()">時間割に追加</button>
      <button onclick="saveTimetableToBackend()">保存</button>
      <button onclick="downloadTimetable()">PNGダウンロード</button>
    </div>

    <div class="section">
      <h2>📘 私の時間割</h2>
      <div class="timetable" id="timetable">
        <div></div>
        <div class="day-label">月</div>
        <div class="day-label">火</div>
        <div class="day-label">水</div>
        <div class="day-label">木</div>
        <div class="day-label">金</div>
      </div>
    </div>
  </div>

  <!-- モーダル -->
  <div id="classModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h3>授業検索・追加</h3>
      <input type="text" id="searchInput" placeholder="授業名または教授名で検索" />
      <div id="classList"></div>
    </div>
  </div>

  <script>
    const timetable = document.getElementById("timetable");
    const times = ["9:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00","24:00"];
    for (let i = 0; i < times.length; i++) {
      timetable.innerHTML += `<div class="time-label">${times[i]}</div>`;
      for (let j = 0; j < 5; j++) {
        timetable.innerHTML += `<div data-day="${j}" data-time="${i}" onclick="openModal(this)"></div>`;
      }
    }

    let fetchedClasses = [
      { subjectCode: "CS101-01-00", subject: "Webサービス応用", day: "水", period: "5-7", professor: "チェ・ジュンサム", room: "昌508" },
      { subjectCode: "CS102-01-00", subject: "オペレーティングシステム", day: "月", period: "2-4", professor: "ユン・サンギュン", room: "昌141" },
      { subjectCode: "MATH201-01-00", subject: "AI数学", day: "金", period: "6-8", professor: "ソン・テウン", room: "昌321" }
    ];
    const subjectColors = {};
    const savedSchedules = [];

    function getLightRandomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 100%, 85%)`;
    }

    function addSchedule(schedule) {
      const { subjectCode, subject, day, period, professor, room } = schedule;
      const dayIndex = { "月": 0, "火": 1, "水": 2, "木": 3, "金": 4 }[day];
      const [startStr, endStr] = period.split('-');
      const start = parseInt(startStr) - 1;
      const end = parseInt(endStr) - 1;

      if (!subjectColors[subject]) {
        subjectColors[subject] = getLightRandomColor();
      }
      const bgColor = subjectColors[subject];
      for (let i = start; i <= end; i++) {
        const cell = document.querySelector(`[data-day="${dayIndex}"][data-time="${i}"]`);
        if (cell) {
          cell.innerHTML = (i === start) ? `
            <div class="class-box" data-subject="${subject}" style="background-color: ${bgColor}">
              ${subject}<br>${professor}<br>${room}
              <button class="delete-btn" onclick="deleteSchedule(event, '${subject}')">X</button>
            </div>
          ` : `
            <div class="class-box" data-subject="${subject}" style="background-color: ${bgColor}"></div>
          `;
        }
      }

      savedSchedules.push(schedule);
    }

    function deleteSchedule(event, subject) {
      event.stopPropagation();
      if (!confirm("この授業を削除してもよろしいですか？")) return;

      document.querySelectorAll(`.class-box[data-subject="${subject}"]`).forEach(box => {
        box.parentElement.innerHTML = "";
      });

      const index = savedSchedules.findIndex(item => item.subject === subject);
      if (index > -1) savedSchedules.splice(index, 1);
    }

    function openClassModal() {
      document.getElementById("classModal").style.display = "flex";

      fetch("http://localhost:8080/api/subjects/timetable", {
        method: "GET"
      })
        .then(res => res.json())
        .then(data => {
          fetchedClasses = data;
          renderClassList(""); // すべての授業を表示
        })
        .catch(err => {
          console.error("時間割データの読み込みに失敗しました", err);
          alert("❌ 時間割データの読み込みに失敗しました。");
        });
    }

    function renderClassList(query) {
      const listEl = document.getElementById("classList");
      listEl.innerHTML = "";

      const filtered = fetchedClasses.filter(cls =>
        cls.subject.includes(query) || cls.professor.includes(query)
      );

      filtered.forEach(cls => {
        const div = document.createElement("div");
        div.className = "class-item";
        div.innerHTML = `<strong>${cls.subject}</strong> (${cls.professor}) - ${cls.day} ${cls.period}`;
        div.onclick = () => {
          addSchedule(cls);
          document.getElementById("classModal").style.display = "none";
        };
        listEl.appendChild(div);
      });
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      renderClassList(e.target.value);
    });

    document.getElementById("classModal").addEventListener("click", e => {
      if (e.target === document.getElementById("classModal")) {
        e.target.style.display = "none";
      }
    });

    function saveTimetableToBackend() {
      console.log("送信するデータ:", savedSchedules);
      fetch("http://localhost:8080/api/timetable/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(savedSchedules),
      })
        .then(res => res.text())
        .then(data => alert("✅ 時間割の保存に成功しました"))
        .catch(err => alert("❌ 保存に失敗しました"));
    }

    function openModal(cell) {
      // 今後のセルクリック機能用
    }

    function downloadTimetable() {
      const container = document.querySelector('.section');
      html2canvas(container).then(canvas => {
        const link = document.createElement('a');
        link.download = 'timetable.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function loadMyTimetable() {
      fetch("http://localhost:8080/api/timetable/my", {
        method: "GET"
      })
        .then(res => res.json())
        .then(data => {
          console.log("📚 私の時間割データ:", data);
          data.forEach(item => {
            addSchedule(item);
          });
        })
        .catch(err => {
          console.error("❌ 私の時間割の読み込みに失敗しました", err);
        });
    }
    // ページ読み込み後に私の時間割を読み込む
    window.onload = function() {
      loadMyTimetable();
    };
  </script>
</body>
</html>
