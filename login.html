<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YonU 로그인</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h2 {
      margin-top: 100px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.9em;
      color: gray;
      margin-bottom: 30px;
    }
    form {
      max-width: 400px;
      margin: 0 auto;
    }
    label {
      display: block;
      text-align: left;
      margin-left: 15px;
      font-size: 0.9em;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="password"] {
      width: 90%;
      max-width: 350px;
      padding: 10px;
      margin-bottom: 20px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .login-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 10px;
      width: 90%;
      max-width: 375px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      margin-top: 32px;
      margin-bottom: 10px;
    }
    .extra-links {
      margin-top: 15px;
      font-size: 0.85em;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .extra-links a {
      color: #6db2ff;
      text-decoration: none;
    }
    .language-select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h2 id="welcomeText"></h2>
<p class="subtitle" id="subtitleText"></p>

<form id="loginForm">
  <label for="email" id="emailLabel"></label>
  <input id="email" type="text" name="email" required>

  <label for="password" id="passwordLabel"></label>
  <input id="password" type="password" name="password" required>

  <button class="login-btn" type="submit" id="loginButton"></button>
</form>

<div class="extra-links">
  <a href="reset-password.html" id="resetLink"></a>
  <a href="sign_up.html" id="signupLink"></a>
  <select id="languageSelect" class="language-select">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="cn">中文</option>
    <option value="jp">日本語</option>
  </select>
</div>

<script>
  const translations = {
    ko: {
      welcome: "YonU에 오신 걸 환영합니다",
      subtitle: "YonU는 연세대학교 유학생 커뮤니티입니다",
      email: "이메일",
      password: "비밀번호",
      login: "로그인",
      reset: "비밀번호 찾기",
      signup: "회원가입"
    },
    en: {
      welcome: "Welcome to YonU",
      subtitle: "YonU is a community for international students at Yonsei University",
      email: "Email",
      password: "Password",
      login: "Login",
      reset: "Find Password",
      signup: "Sign Up"
    },
    cn: {
      welcome: "欢迎来到 YonU",
      subtitle: "YonU 是延世大学国际学生社区",
      email: "邮箱",
      password: "密码",
      login: "登录",
      reset: "找回密码",
      signup: "注册"
    },
    jp: {
      welcome: "YonU へようこそ",
      subtitle: "YonU は延世大学の留学生コミュニティです",
      email: "メールアドレス",
      password: "パスワード",
      login: "ログイン",
      reset: "パスワード再発行",
      signup: "新規登録"
    }
  };

  const elements = {
    welcomeText: document.getElementById("welcomeText"),
    subtitleText: document.getElementById("subtitleText"),
    emailLabel: document.getElementById("emailLabel"),
    passwordLabel: document.getElementById("passwordLabel"),
    loginButton: document.getElementById("loginButton"),
    resetLink: document.getElementById("resetLink"),
    signupLink: document.getElementById("signupLink")
  };

  const setLanguage = (lang) => {
    localStorage.setItem("lang", lang);
    const t = translations[lang];
    elements.welcomeText.textContent = t.welcome;
    elements.subtitleText.textContent = t.subtitle;
    elements.emailLabel.textContent = t.email;
    elements.passwordLabel.textContent = t.password;
    elements.loginButton.textContent = t.login;
    elements.resetLink.textContent = t.reset;
    elements.signupLink.textContent = t.signup;
  };

  document.getElementById("languageSelect").addEventListener("change", (e) => {
    setLanguage(e.target.value);
  });

  setLanguage(localStorage.getItem("lang") || "ko");

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const language = document.getElementById('languageSelect').value;

    if (!email || !password) {
      alert('이메일과 비밀번호를 모두 입력해주세요.');
      return;
    }

    const loginData = { email, password };
    const url = '/api/login';

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(loginData)
      });

      const result = await response.text();
      if (result.includes("성공")) {
        alert("✅ 로그인 성공");
        window.location.href = "/main";
      } else {
        alert("❌ " + result);
      }
    } catch (err) {
      alert("⚠️ 서버 오류 발생");
    }
  });
</script>
</body>
</html>
