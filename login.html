<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YonU 로그인</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h2 {
      margin-top: 100px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9em;
      color: gray;
      margin-bottom: 30px;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
    }

    label {
      display: block;
      text-align: left;
      margin-left: 15px;
      font-size: 0.9em;
      margin-bottom: 5px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 90%;
      max-width: 350px;
      padding: 10px;
      margin-bottom: 20px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .login-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 10px;
      width: 90%;
      max-width: 375px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      margin-top: 32px;
      margin-bottom: 10px;
    }

    .extra-links {
      margin-top: 15px;
      font-size: 0.85em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .extra-links a {
      color: #6db2ff;
      text-decoration: none;
    }

    .language-select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

  </style>
</head>
<body>
<h2>YonU에 오신 걸 환영합니다</h2>
<p class="subtitle">YonU는 연세대학교 유학생 커뮤니티입니다</p>

<form id="loginForm">
  <label for="email">이메일</label>
  <input id="email" type="text" name="email" placeholder="이메일" required>

  <label for="password">비밀번호</label>
  <input id="password" type="password" name="password" placeholder="비밀번호" required>

  <button class="login-btn" type="submit">로그인</button>
</form>

<div class="extra-links">
  <a href="/reset-password">비밀번호 찾기</a>
  <a href="/sign_up">회원가입</a>
  <select id="languageSelect" class="language-select">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="cn">中文</option>
    <option value="jp">日本語</option>
  </select>
</div>



<script>
  document.getElementById("languageSelect").addEventListener("change", function() {
    const selected = this.value;
    switch (selected) {
      case "en":
        window.location.href = "login_en.html";
        break;
      case "jp":
        window.location.href = "login_jp.html";
        break;
      case "cn":
        window.location.href = "login_cn.html";
        break;
      case "ko":
        window.location.href = "login.html";
        break;
    }
  });


  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const language = document.getElementById('languageSelect').value;

    if (!emailInput || !passwordInput) {
      alert("입력 필드를 찾을 수 없습니다.");
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      alert('이메일과 비밀번호를 모두 입력해주세요.');
      return;
    }

    const loginData = {
      email,
      password,
      preferredLanguage: language
    };

    const url = '/api/login';

    console.log("📤 보낸 요청 JSON:");
    console.log(JSON.stringify(loginData, null, 2));

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'same-origin',
        body: JSON.stringify(loginData)
      });

      if (!response.ok) throw new Error('서버 응답 오류');

      const resultText = await response.text();
      console.log("📥 받은 응답:");
      console.log(resultText);

      if (resultText.includes("성공")) {
        alert("✅ 로그인 성공");
        window.location.href = "/main";
      } else {
        alert("❌ " + resultText);
      }

    } catch (error) {
      console.error("❗ 로그인 요청 실패:", error);
      alert("⚠️ 서버와 통신 중 오류가 발생했습니다. 나중에 다시 시도해주세요.");
    }
  });
</script>
</body>
</html>
