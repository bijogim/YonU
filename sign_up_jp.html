<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YonU ユーザー登録</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h3 {
      margin: 30px 0 40px 0;
      font-size: 22px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    .signup-btn,
    select {
      padding: 10.5px;
      margin-bottom: 35px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      font-size: 14px;
    }

    .checkbox input {
      margin-right: 10px;
    }

    .signup-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      transition: background-color 0.5s;
      cursor: pointer;
    }

    .signup-btn:hover {
      background-color: #2145a9;
    }

    /* ポップアップスタイル */
    #modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #modal:target {
      display: flex;
    }

    .modal-content {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      text-decoration: none;
      color: #aaa;
      font-weight: bold;
      transition: color 0.25s;
    }

    .modal-close:hover {
      color: black;
    }

    .terms-link {
      font-size: 12px;
      color: #3160e2;
      text-decoration: underline;
      margin-left: 10px;
    }

    /* ✅ メディアクエリごとの固定pxサイズ */

    /* モバイル（最大600px） */
    @media (max-width: 600px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 280px;
      }

      .language-select {
        width: 300px;
      }
    }

    /* タブレット（601px〜1024px） */
    @media (min-width: 601px) and (max-width: 1024px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 340px;
      }

      .language-select {
        width: 360px;
      }
    }

    /* PC（1025px以上） */
    @media (min-width: 1025px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 400px;
      }

      .language-select {
        width: 420px;
      }
    }
  </style>
</head>
<body>
  <h3>会員情報をご入力ください</h3>

  <!-- 言語選択ドロップダウン -->
  <select id="language" class="language-select" required>
    <option value="jp">日本語</option>
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="cn">中文</option>
  </select>

  <form action="/submit" method="POST">
    <input type="email" id="email" placeholder="延世メールアドレス" required>
    <input type="password" id="password" placeholder="パスワード" required>
    <input type="text" id="realName" placeholder="本名" required>
    <input type="text" id="studentId" placeholder="学籍番号" required>
    <input type="text" id="department" placeholder="学科" required>
    <input type="text" id="nickname" placeholder="ニックネーム" required>



    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <label for="terms">個人情報利用及び会員登録規約への同意</label>
      <a href="#modal" class="terms-link">[規約を見る]</a>
    </div>

    <button type="submit" class="signup-btn">会員登録</button>
  </form>

  <!-- ログイン画面への戻りリンク追加 -->
  <div style="margin-top: 20px; margin-bottom: 40px; font-size: 0.9em;">
    <a href="login.html" style="color: #3160e2; text-decoration: none;">ログイン画面に戻る</a>
  </div>

  <!-- モーダルポップアップ -->
  <div id="modal">
    <div class="modal-content">
      <a href="#" class="modal-close">&times;</a>
      <h4>個人情報利用及び会員登録規約</h4>
      <p style="font-size: 13px; text-align: left;">
        YonUは延世大学の在学生のためのサービスであり、会員登録時に以下の事項に同意したものとみなします。
        <br><br>
        ● 収集情報：氏名、学籍番号、学科、延世メールアドレス、ニックネームなど<br>
        ● 使用目的：コミュニティ運営、認証、時間割共有など<br>
        ● 保管期間：退会時即時破棄<br>
        ● その他事項は個人情報処理方針参照<br><br>
        本規約はサービス改善及び方針変更により修正される場合があり、変更時はお知らせを通じて案内します。
      </p>
    </div>
  </div>
  <script>
    // 언어 선택 시 페이지 이동
    document.getElementById("language").addEventListener("change", function () {
      const selected = this.value;
      switch (selected) {
        case "ko":
          window.location.href = "sign_up.html";
          break;
        case "en":
          window.location.href = "sign_up_en.html";
          break;
        case "jp":
          window.location.href = "sign_up_jp.html";
          break;
        case "cn":
          window.location.href = "sign_up_cn.html";
          break;
      }
    });

    document.querySelector('form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("realName").value.trim();
      const studentId = document.getElementById("studentId").value.trim();
      const department = document.getElementById("department").value.trim();
      const nickname = document.getElementById("nickname").value.trim();
      const preferredLanguage = document.getElementById("language").value;
      const termsChecked = document.getElementById("terms").checked;

      if (!termsChecked) {
        alert("📌 規約に同意する必要があります。");
        return;
      }

      if (!email || !password || !name || !studentId || !department || !nickname) {
        alert("すべての情報を入力してください。");
        return;
      }

      const userDto = {
        email,
        password,
        name,
        studentId,
        department,
        nickname,
        preferredLanguage
      };

      try {
        const response = await fetch("/api/sign_up", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userDto)
        });

        const result = await response.text();

        if (response.ok) {
          alert("🎉 会員登録成功！ログインページに移動します。");
          window.location.href = "/login";
        } else {
          alert("❌ 会員登録失敗: " + result);
        }
      } catch (error) {
        console.error("サーバー通信エラー:", error);
        alert("⚠️ サーバーとの接続中にエラーが発生しました。");
      }
    });
  </script>

</body>
</html>
