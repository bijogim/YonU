<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>YonU 注册</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h3 {
      margin: 30px 0 40px 0;
      font-size: 22px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    .signup-btn,
    select {
      padding: 10.5px;
      margin-bottom: 35px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      font-size: 14px;
    }

    .checkbox input {
      margin-right: 10px;
    }

    .signup-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      transition: background-color 0.5s;
      cursor: pointer;
    }

    .signup-btn:hover {
      background-color: #2145a9;
    }

    /* 弹窗样式 */
    #modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #modal:target {
      display: flex;
    }

    .modal-content {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      text-decoration: none;
      color: #aaa;
      font-weight: bold;
      transition: color 0.25s;
    }

    .modal-close:hover {
      color: black;
    }

    .terms-link {
      font-size: 12px;
      color: #3160e2;
      text-decoration: underline;
      margin-left: 10px;
    }

    /* ✅ 媒体查询固定px */

    /* 手机 (最大600px) */
    @media (max-width: 600px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 280px;
      }

      .language-select {
        width: 300px;  /* 语言选择宽20px */
      }
    }

    /* 平板 (601px ~ 1024px) */
    @media (min-width: 601px) and (max-width: 1024px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 340px;
      }

      .language-select {
        width: 360px;  /* 语言选择宽20px */
      }
    }

    /* 电脑 (1025px以上) */
    @media (min-width: 1025px) {
      input[type="text"],
      input[type="password"],
      input[type="email"],
      .signup-btn,
      select {
        width: 400px;
      }

      .language-select {
        width: 420px;  /* 语言选择宽20px */
      }
    }
  </style>
</head>
<body>
  <h3>请输入您的信息</h3>

  <!-- 语言选择下拉框 -->
  <select id="language" class="language-select" required>
    <option value="cn">中文</option>
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="jp">日本語</option>
  </select>

  <form action="/submit" method="POST">
    <input type="email" id="email" placeholder="延世邮箱" required>
    <input type="password" id="password" placeholder="密码" required>
    <input type="text" id="realName" placeholder="真实姓名" required>
    <input type="text" id="studentId" placeholder="学号" required>
    <input type="text" id="department" placeholder="院系" required>
    <input type="text" id="nickname" placeholder="昵称" required>



    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <label for="terms">同意服务条款及个人信息处理政策</label>
      <a href="#modal" class="terms-link">[查看条款]</a>
    </div>

    <button type="submit" class="signup-btn">注册</button>
  </form>

  <!-- 返回登录链接 -->
  <div style="margin-top: 20px; margin-bottom: 40px; font-size: 0.9em;">
    <a href="login.html" style="color: #3160e2; text-decoration: none;">返回登录</a>
  </div>

  <!-- 弹窗 -->
  <div id="modal">
    <div class="modal-content">
      <a href="#" class="modal-close">&times;</a>
      <h4>服务条款及个人信息处理政策</h4>
      <p style="font-size: 13px; text-align: left;">
        YonU是为延世大学学生提供的服务，注册即视为同意以下条款：
        <br><br>
        ● 收集信息：姓名、学号、院系、延世邮箱、昵称等<br>
        ● 使用目的：社区运营、身份验证、课表共享等<br>
        ● 保留期限：退会时立即删除<br>
        ● 其他事项请参考个人信息处理政策<br><br>
        本条款可能因服务改进或政策变更而修改，修改时会通过公告通知。
      </p>
    </div>
  </div>
  <script>
    // 언어 선택 시 페이지 이동
    document.getElementById("language").addEventListener("change", function () {
      const selected = this.value;
      switch (selected) {
        case "ko":
          window.location.href = "sign_up.html";
          break;
        case "en":
          window.location.href = "sign_up_en.html";
          break;
        case "jp":
          window.location.href = "sign_up_jp.html";
          break;
        case "cn":
          window.location.href = "sign_up_cn.html";
          break;
      }
    });

    document.querySelector('form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("realName").value.trim();
      const studentId = document.getElementById("studentId").value.trim();
      const department = document.getElementById("department").value.trim();
      const nickname = document.getElementById("nickname").value.trim();
      const preferredLanguage = document.getElementById("language").value;
      const termsChecked = document.getElementById("terms").checked;

      if (!termsChecked) {
        alert("📌 必须同意条款才能注册。");
        return;
      }

      if (!email || !password || !name || !studentId || !department || !nickname) {
        alert("请填写所有信息。");
        return;
      }

      const userDto = {
        email,
        password,
        name,
        studentId,
        department,
        nickname,
        preferredLanguage
      };

      try {
        const response = await fetch("/api/sign_up", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userDto)
        });

        const result = await response.text();

        if (response.ok) {
          alert("🎉 注册成功！正在跳转到登录页面。");
          window.location.href = "/login";
        } else {
          alert("❌ 注册失败: " + result);
        }
      } catch (error) {
        console.error("服务器通信错误:", error);
        alert("⚠️ 连接服务器时发生错误。");
      }
    });
  </script>

</body>
</html>
