<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h2 {
      margin-top: 100px;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 30px;
    }
    input[type="email"] {
      width: 400px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .find-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 9px;
      width: 425px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .find-btn:hover {
      background-color: #589ee5;
    }
    .back-link {
      margin-top: 20px;
      font-size: 0.9em;
    }
    .back-link a {
      color: #6db2ff;
      text-decoration: none;
    }
    .language-select {
      margin-top: 20px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #6db2ff;
      font-size: 0.85em;
      background-color: white;
      color: #0f5cb4;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2 id="title"></h2>

  <form id="reset-form" class="form-group">
    <input type="email" id="email" required>
    <button type="submit" class="find-btn" id="submitBtn"></button>
  </form>

  <div class="back-link">
    <a id="backLink" href="/login.html"></a>
  </div>

  <select id="languageSelect" class="language-select">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="jp">日本語</option>
    <option value="cn">中文</option>
  </select>

  <script>
    const translations = {
      ko: {
        title: "비밀번호 찾기",
        placeholder: "연세 이메일을 입력해주세요.",
        submit: "비밀번호 찾기",
        back: "로그인 페이지로 돌아가기",
        success: "임시 비밀번호가 이메일로 발송되었습니다.",
        fail: "요청 처리 중 문제가 발생했습니다.",
        error: "서버 오류가 발생했습니다."
      },
      en: {
        title: "Find Password",
        placeholder: "Please enter your Yonsei email",
        submit: "Find Password",
        back: "Back to Login Page",
        success: "A password reset link has been sent to your email.",
        fail: "There was a problem processing your request.",
        error: "An error occurred while communicating with the server."
      },
      jp: {
        title: "パスワード再発行",
        placeholder: "延世大学のメールアドレスを入力してください",
        submit: "パスワード再発行",
        back: "ログインページへ戻る",
        success: "パスワード再設定用リンクをメールで送信しました。",
        fail: "リクエスト処理中に問題が発生しました。",
        error: "サーバーとの通信中にエラーが発生しました。"
      },
      cn: {
        title: "找回密码",
        placeholder: "请输入您的延世大学邮箱",
        submit: "找回密码",
        back: "返回登录页",
        success: "密码重置链接已发送至您的邮箱。",
        fail: "处理请求时出现问题。",
        error: "与服务器通信时发生错误。"
      }
    };

    function setLanguage(lang) {
      localStorage.setItem("lang", lang);
      const t = translations[lang];
      document.getElementById("title").textContent = t.title;
      document.getElementById("email").placeholder = t.placeholder;
      document.getElementById("submitBtn").textContent = t.submit;
      document.getElementById("backLink").textContent = t.back;
    }

    document.getElementById("languageSelect").addEventListener("change", function() {
      setLanguage(this.value);
    });

    setLanguage(localStorage.getItem("lang") || "ko");

    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const lang = document.getElementById('languageSelect').value;
      const email = document.getElementById('email').value;

      fetch('/reset-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: email })
      })
      .then(response => {
        if (response.ok) {
          alert(translations[lang].success);
        } else {
          alert(translations[lang].fail);
        }
      })
      .catch(error => {
        alert(translations[lang].error);
      });
    });
  </script>

</body>
</html>
