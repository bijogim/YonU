<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이디/비밀번호 찾기</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h2 {
      margin-top: 100px;
      margin-bottom: 20px;
      font-size: 24px;
    }

    h3 {
      margin-top: 40px;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px ;
      margin-bottom: 30px;
    }

    input[type="email"],
    input[type="text"] {
      width: 400px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .find-btn {
      background-color: #6db2ff;
      color: white;
      border: none;
      padding: 9px;
      width: 425px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .find-btn:hover {
      background-color: #589ee5;
    }

    .back-link {
      margin-top: 20px;
      font-size: 0.9em;
    }

    .back-link a {
      color: #6db2ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>비밀번호 찾기</h2>

  <form id="reset-form" class="form-group">
    <input type="email" id="email" placeholder="연세 이메일을 입력해주세요." required>
    <button type="submit" class="find-btn">비밀번호 찾기</button>
  </form>

  <div class="back-link">
    <a href="login_jp.html">로그인 페이지로 돌아가기기</a>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault(); // デフォルトのフォーム動作を防ぐ

      const email = document.getElementById('email').value;

      fetch('/reset-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: email })
      })
      .then(response => {
        if (response.ok) {
          alert('パスワード再設定用リンクをメールで送信しました。');
        } else {
          alert('リクエスト処理中に問題が発生しました。');
        }
      })
      .catch(error => {
        console.error('エラー:', error);
        alert('サーバーとの通信中にエラーが発生しました。');
      });
    });
  </script>

</body>
</html>
